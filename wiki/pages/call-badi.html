  <h1>CALL BADI</h1>
  <p>Gọi BAdI method trên mọi object plug-in được reference.</p>
  <pre>CALL BADI badi->meth ...
   | badi->(meth_name) ...</pre>
  <p>Multiple use: <code>badi</code> initial → không effect. Single use: <code>badi</code> phải valid.</p>
